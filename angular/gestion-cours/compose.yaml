services:
  api:
    init: true
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - donnees:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/courses').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    init: true
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  donnees:
